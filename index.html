<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1983</title>
  <meta property="og:title" content="1983 (&quot;Costco, G-Shock, Van Leeuwen, Lappert's Ice Cream, Jeremy Payne&quot;)">
  <meta property="og:description" content="Lord Bluetooth music — 1983 and the Anthem">
  <meta property="og:type" content="music.song">
  <meta property="og:url" content="https://jerbotclaw-max.github.io/lord-bluetooth-music/">
  <meta property="og:image" content="https://jerbotclaw-max.github.io/lord-bluetooth-music/cover.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(135deg, #0a0a1a 0%, #1a0b2e 40%, #0d1b2a 70%, #1a0b2e 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Press Start 2P', monospace;
      color: #fff;
      overflow: hidden;
      padding: 20px;
    }

    /* Stars */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        radial-gradient(1px 1px at 50px 80px, #fff, transparent),
        radial-gradient(1px 1px at 150px 200px, rgba(255,255,255,0.8), transparent),
        radial-gradient(2px 2px at 250px 50px, #1084d0, transparent),
        radial-gradient(1px 1px at 350px 300px, #fff, transparent),
        radial-gradient(2px 2px at 450px 150px, rgba(255,255,255,0.7), transparent),
        radial-gradient(1px 1px at 550px 80px, #ff00ff, transparent),
        radial-gradient(2px 2px at 650px 250px, rgba(255,255,255,0.9), transparent),
        radial-gradient(1px 1px at 750px 100px, #fff, transparent);
      background-size: 800px 350px;
      animation: starScroll 90s linear infinite;
      z-index: 0;
    }

    @keyframes starScroll {
      from { background-position: 0 0; }
      to { background-position: 800px 350px; }
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
      max-width: 760px;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 5px;
    }

    .header h1 {
      font-size: 18px;
      background: linear-gradient(90deg, #ff00ff, #00ffff, #ff00ff);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradientShift 3s linear infinite;
      text-shadow: none;
      filter: drop-shadow(0 0 20px rgba(255,0,255,0.5));
    }

    @keyframes gradientShift {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    /* Winamp Window */
    .winamp {
      background: #c0c0c0;
      border: 2px solid #fff;
      border-top-color: #fff;
      border-left-color: #fff;
      border-right-color: #404040;
      border-bottom-color: #404040;
      box-shadow: inset -1px -1px 0 #404040, inset 1px 1px 0 #dfdfdf, 6px 6px 0 rgba(0,0,0,0.4);
      width: 100%;
    }

    .winamp-titlebar {
      background: linear-gradient(90deg, #000080, #1084d0);
      padding: 3px 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: default;
    }

    .winamp-title {
      color: #fff;
      font-size: 10px;
      font-family: 'Press Start 2P', monospace;
      text-shadow: 1px 1px 0 #000;
    }

    .winamp-buttons {
      display: flex;
      gap: 2px;
    }

    .winamp-btn {
      width: 16px;
      height: 14px;
      background: #c0c0c0;
      border: 1px solid;
      border-top-color: #fff;
      border-left-color: #fff;
      border-right-color: #404040;
      border-bottom-color: #404040;
      font-size: 9px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-family: monospace;
    }

    .winamp-btn:active {
      border-top-color: #404040;
      border-left-color: #404040;
      border-right-color: #fff;
      border-bottom-color: #fff;
    }

    /* Main content */
    .winamp-main {
      display: flex;
      background: #000;
      padding: 5px;
      gap: 5px;
    }

    /* Visualization */
    .vis-container {
      width: 220px;
      min-width: 220px;
      height: 150px;
      background: #000;
      border: 2px solid #808080;
      border-top-color: #fff;
      border-left-color: #fff;
      border-right-color: #404040;
      border-bottom-color: #404040;
      position: relative;
      overflow: hidden;
    }

    #visualizer {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Playlist */
    .playlist-container {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .playlist-header {
      background: linear-gradient(90deg, #808080, #a0a0a0);
      padding: 2px 5px;
      font-size: 8px;
      color: #fff;
      text-shadow: 1px 1px 0 #000;
      font-family: 'Press Start 2P', monospace;
    }

    .playlist {
      flex: 1;
      background: #000;
      border: 2px solid #808080;
      border-top-color: #fff;
      border-left-color: #fff;
      border-right-color: #404040;
      border-bottom-color: #404040;
      overflow-y: auto;
      max-height: 130px;
    }

    .playlist-item {
      padding: 3px 8px;
      font-size: 8px;
      color: #00ff00;
      cursor: pointer;
      font-family: 'VT323', monospace;
      font-size: 14px;
    }

    .playlist-item:hover, .playlist-item.active {
      background: #000080;
      color: #fff;
    }

    .playlist-item.active::before {
      content: '▶ ';
    }

    /* Progress bar */
    .progress-bar {
      width: 100%;
      height: 14px;
      background: #404040;
      cursor: pointer;
      position: relative;
      border: 1px solid #808080;
    }
    .progress-bar:hover {
      background: #505050;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #00ff00, #80ff80);
      width: 0%;
      transition: width 0.1s linear;
    }

    .progress-bar:hover .progress-fill {
      background: linear-gradient(90deg, #ffff00, #80ff80);
    }

    /* Track info */
    .track-info {
      background: #000;
      border: 2px solid #808080;
      border-top-color: #fff;
      border-left-color: #fff;
      border-right-color: #404040;
      border-bottom-color: #404040;
      padding: 5px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .track-name {
      font-size: 9px;
      color: #ff9900;
      font-family: 'VT323', monospace;
      font-size: 16px;
      animation: neonPulse 2s ease-in-out infinite;
    }

    @keyframes neonPulse {
      0%, 100% { text-shadow: 0 0 5px #ff9900; }
      50% { text-shadow: 0 0 20px #ff9900, 0 0 30px #ff6600; }
    }

    .track-time {
      font-size: 11px;
      color: #ff9900;
      font-family: 'VT323', monospace;
      font-size: 18px;
      background: #000;
      padding: 2px 8px;
      border: 1px inset #808080;
      min-width: 120px;
      text-align: center;
    }

    /* EQ */
    .eq-container {
      display: flex;
      justify-content: center;
      gap: 3px;
      padding: 4px 5px;
      background: #c0c0c0;
    }

    .eq-bar {
      width: 8px;
      height: 35px;
      background: #000;
      border: 1px solid #808080;
      position: relative;
      overflow: hidden;
    }

    .eq-fill {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: linear-gradient(to top, #00ff00 0%, #80ff00 50%, #ffff00 80%, #ff0000 100%);
      animation: eqDance 0.4s ease-in-out infinite alternate;
    }

    @keyframes eqDance {
      from { height: 15%; }
      to { height: 90%; }
    }

    .eq-bar:nth-child(1) .eq-fill { animation-delay: 0s; animation-duration: 0.35s; }
    .eq-bar:nth-child(2) .eq-fill { animation-delay: 0.05s; animation-duration: 0.42s; }
    .eq-bar:nth-child(3) .eq-fill { animation-delay: 0.1s; animation-duration: 0.38s; }
    .eq-bar:nth-child(4) .eq-fill { animation-delay: 0.08s; animation-duration: 0.45s; }
    .eq-bar:nth-child(5) .eq-fill { animation-delay: 0.03s; animation-duration: 0.33s; }
    .eq-bar:nth-child(6) .eq-fill { animation-delay: 0.12s; animation-duration: 0.41s; }
    .eq-bar:nth-child(7) .eq-fill { animation-delay: 0.07s; animation-duration: 0.37s; }
    .eq-bar:nth-child(8) .eq-fill { animation-delay: 0.02s; animation-duration: 0.44s; }
    .eq-bar:nth-child(9) .eq-fill { animation-delay: 0.09s; animation-duration: 0.36s; }
    .eq-bar:nth-child(10) .eq-fill { animation-delay: 0.04s; animation-duration: 0.39s; }

    /* Controls */
    .controls {
      display: flex;
      justify-content: center;
      gap: 4px;
      padding: 5px;
      background: #c0c0c0;
    }

    .ctrl-btn {
      width: 28px;
      height: 22px;
      background: #c0c0c0;
      border: 2px solid;
      border-top-color: #fff;
      border-left-color: #fff;
      border-right-color: #404040;
      border-bottom-color: #404040;
      cursor: pointer;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: monospace;
    }

    .ctrl-btn:active {
      border-top-color: #404040;
      border-left-color: #404040;
      border-right-color: #fff;
      border-bottom-color: #fff;
    }

    .ctrl-btn.active {
      background: #000080;
      color: #fff;
    }

    /* Volume */
    .volume-container {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 5px;
      background: #c0c0c0;
    }

    .volume-label {
      font-size: 8px;
      color: #000;
    }

    .volume-slider {
      width: 80px;
      height: 4px;
      appearance: none;
      background: linear-gradient(to right, #00ff00 var(--vol, 70%), #808080 var(--vol, 70%));
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      appearance: none;
      width: 10px;
      height: 16px;
      background: #c0c0c0;
      border: 1px solid;
      border-top-color: #fff;
      border-left-color: #fff;
      border-right-color: #404040;
      border-bottom-color: #404040;
    }

    /* ===== KARAOKE LYRICS SECTION ===== */
    .karaoke-container {
      width: 100%;
      max-height: 160px;
      background: rgba(0, 0, 0, 0.85);
      border: 3px solid;
      border-image: linear-gradient(135deg, #ff00ff, #00ffff, #ff00ff) 1;
      padding: 15px 25px;
      text-align: center;
      position: relative;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .karaoke-container::before {
      content: '';
      position: sticky;
      top: 0;
      display: block;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ff00ff, #00ffff, #ff00ff, transparent);
      margin-bottom: 10px;
      z-index: 1;
    }

    .karaoke-label {
      font-size: 8px;
      color: #808080;
      margin-bottom: 10px;
      font-family: 'Press Start 2P', monospace;
    }

    #karaokeDisplay {
      font-family: 'VT323', monospace;
      font-size: 32px;
      min-height: 80px;
      line-height: 1.4;
      letter-spacing: 2px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px 12px;
    }

    .kw {
      display: inline-block;
      transition: all 0.08s ease-out;
      padding: 2px 4px;
      border-radius: 3px;
    }

    .kw.past {
      color: #404040;
      text-shadow: none;
    }

    .kw.current {
      color: #fff;
      text-shadow: 0 0 10px currentColor, 0 0 20px currentColor, 0 0 30px currentColor;
      transform: scale(1.15);
    }

    .kw.upcoming {
      color: #606060;
      text-shadow: none;
    }

    /* Word type colors */
    .kw.costco.current { color: #ff6600; }
    .kw.gshock.current { color: #ff00ff; }
    .kw.jeremy.current { color: #00ffff; }
    .kw.chorus.current { color: #ffff00; }
    .kw.normal.current { color: #ffffff; }

    .kw.lappert.current { color: #ff69b4; }
    .kw.lappert.upcoming { color: #8b4560; }
    .kw.costco.upcoming { color: #8b4500; }
    .kw.gshock.upcoming { color: #8b008b; }
    .kw.jeremy.upcoming { color: #008b8b; }
    .kw.vanleeuwen.current { color: #7fff00; }
    .kw.vanleeuwen.upcoming { color: #456500; }
    .kw.year.current { color: #ffd700; }
    .kw.year.upcoming { color: #8b7500; }
    .kw.chorus.upcoming { color: #8b8b00; }

    /* ===== VISUALIZER CANVAS ===== */
    #visualizer {
      image-rendering: auto;
    }

    /* Credits */
    .credits {
      font-size: 7px;
      color: #505050;
      text-align: center;
      margin-top: 10px;
    }

    .credits a {
      color: #1084d0;
    }

    /* Scanlines */
    .scanlines {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0.1),
        rgba(0,0,0,0.1) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 1000;
    }

    /* Winamp glow border on vis */
    .vis-container::after {
      content: '';
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 30px rgba(16, 132, 208, 0.3);
      pointer-events: none;
    }
  </style>
</head>

  <div class="scanlines"></div>

  <div class="container">
    <div class="header">
      <h1>🎵 LORD BLUETOOTH 🎵</h1>
    </div>

    <div class="winamp">
      <div class="winamp-titlebar">
        <span class="winamp-title">Lord Bluetooth — Winamp 2.81</span>
        <div class="winamp-buttons">
          <button class="winamp-btn" title="Minimize">_</button>
          <button class="winamp-btn" title="Maximize">□</button>
          <button class="winamp-btn" title="Close" onclick="document.querySelector('.winamp').style.display=document.querySelector('.winamp').style.display=='none'?'block':'none'">×</button>
        </div>
      </div>

      <div class="winamp-main">
        <div class="vis-container">
          <canvas id="visualizer"></canvas>
        </div>

        <div class="playlist-container">
          <div class="playlist-header">📀 Playlist — 4 item(s)</div>
          <div class="playlist">
            <div class="playlist-item active" data-src="1983.mp3" data-title="1983" onclick="selectTrack(this)">▶ 1. 1983</div>

            <div class="playlist-item" data-src="Steve_Jobs_Tribute.mp3" data-title="Steve Jobs Tribute" onclick="selectTrack(this)">  4. Steve Jobs Tribute</div>
          </div>
        </div>
      </div>

      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="track-info">
        <span class="track-name" id="trackName">▶ 1983</span>
        <span class="track-time" id="trackTime">0:00 / 0:00</span>
      </div>

      <div class="eq-container">
        <div class="eq-bar"><div class="eq-fill"></div></div>
        <div class="eq-bar"><div class="eq-fill"></div></div>
        <div class="eq-bar"><div class="eq-fill"></div></div>

      </div>

      <div class="controls">
        <button class="ctrl-btn" id="prevBtn" title="Previous">⏮</button>
        <button class="ctrl-btn" id="playBtn" title="Play">▶</button>
        <button class="ctrl-btn" id="pauseBtn" title="Pause">⏸</button>
        <button class="ctrl-btn" id="stopBtn" title="Stop">⏹</button>
        <button class="ctrl-btn" id="nextBtn" title="Next">⏭</button>
      </div>

      <div class="volume-container">
        <span class="volume-label">🔊</span>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70">
      </div>
    </div>

    <!-- Karaoke Display -->
    <div class="karaoke-container">
      <div class="karaoke-label">♫ SING ALONG ♫</div>
      <div id="karaokeDisplay">
        <span class="kw upcoming">Press ▶ to sing along...</span>
      </div>
    </div>

    <div class="credits">
      Lord Bluetooth Music Page<br>
      <a href="https://github.com/jerbotclaw-max/lord-bluetooth-music">View on GitHub</a>
    </div>
  </div>

    // ===== AUDIO =====
    function selectTrack(el) {
      document.querySelectorAll('.playlist-item').forEach(i => i.classList.remove('active'));
      el.classList.add('active');
      const src = el.dataset.src;
      const isAnthem = src.includes('Anthem');
      const isMadonna = src.includes('Madonna');
      currentLyrics = isMadonna ? MADONNA_LYRICS : (isAnthem ? ANTHEM_LYRICS : LYRICS);
      const title = el.dataset.title || el.textContent.trim().replace('▶ ','').replace('  ','');
      document.getElementById('trackName').textContent = '▶ ' + title;
      document.title = title;
      document.getElementById('trackTime').textContent = '0:00 / 0:00';
      document.getElementById('progressFill').style.width = '0%';
      audio.src = src;
      audio.load();
      currentWordIndex = -1;
      buildKaraokeHTML();
      if (isPlaying) {
        initAudioContext(); // reconnect Web Audio API after track switch
        audio.play();
        drawVisualizer();
      }
    }

    const audio = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const stopBtn = document.getElementById('stopBtn');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const trackTime = document.getElementById('trackTime');
    const volumeSlider = document.getElementById('volumeSlider');
    const karaokeDisplay = document.getElementById('karaokeDisplay');

    let isPlaying = false;
    let currentWordIndex = -1;
    let karaokeSpans = [];
    let currentLyrics = LYRICS; // active lyrics array
    let idleAnimId = null; // idle visualizer animation

    // ===== VISUALIZER =====
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');
    let analyser, audioContext, source, dataArray;

    function initAudioContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        source = audioContext.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioContext.destination);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
      }
    }

    function drawVisualizer() {
      if (!analyser || !isPlaying) {
        // Draw idle state
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawIdleBars();
        return;
      }

      requestAnimationFrame(drawVisualizer);
      analyser.getByteFrequencyData(dataArray);

      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const barCount = 48;
      const barWidth = canvas.width / barCount - 1;

      for (let i = 0; i < barCount; i++) {
        // Weight toward lower freqs for bass
        const idx = Math.floor(i * dataArray.length / barCount / 2);
        const value = dataArray[idx] || 0;
        const percent = value / 255;
        const height = percent * canvas.height;

        const hue = 180 + (i / barCount) * 120;
        ctx.fillStyle = `hsl(${hue}, 100%, ${40 + percent * 40}%)`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = `hsl(${hue}, 100%, 50%)`;

        ctx.fillRect(i * (barWidth + 1), canvas.height - height, barWidth, height);
      }
      ctx.shadowBlur = 0;

      // Peak line
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, canvas.height * 0.3);
      ctx.lineTo(canvas.width, canvas.height * 0.3);
      ctx.stroke();
    }

    function drawIdleBars() {
      cancelAnimationFrame(idleAnimId);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const barCount = 48;
      const barWidth = canvas.width / barCount - 1;
      function anim() {
        if (isPlaying) return;
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < barCount; i++) {
          const h = 5 + Math.sin(Date.now() / 400 + i * 0.4) * 4;
          ctx.fillStyle = '#1a1a2e';
          ctx.fillRect(i * (barWidth + 1), canvas.height - h, barWidth, h);
        }
        idleAnimId = requestAnimationFrame(anim);
      }
      anim();
    }

    // ===== CONTROLS =====
    playBtn.addEventListener('click', () => {
      initAudioContext();
      audio.play();
      isPlaying = true;
      buildKaraokeHTML();
      cancelAnimationFrame(idleAnimId); // stop idle animation
      drawVisualizer();
    });

    pauseBtn.addEventListener('click', () => {
      audio.pause();
      isPlaying = false;
    });

    audio.addEventListener('ended', () => {
      isPlaying = false;
    });

    stopBtn.addEventListener('click', () => {
      audio.pause();
      audio.currentTime = 0;
      isPlaying = false;
      currentWordIndex = -1;
      buildKaraokeHTML();
    });

    audio.addEventListener('timeupdate', () => {
      const pct = (audio.currentTime / audio.duration) * 100;
      progressFill.style.width = pct + '%';
      trackTime.textContent = formatTime(audio.currentTime) + ' / ' + formatTime(audio.duration || 0);
      updateKaraoke();
    });

    audio.addEventListener('loadedmetadata', () => {
      trackTime.textContent = '0:00 / ' + formatTime(audio.duration);
    });

    progressBar.addEventListener('click', (e) => {
      const rect = progressBar.getBoundingClientRect();
      audio.currentTime = (e.clientX - rect.left) / rect.width * audio.duration;
    });

    volumeSlider.addEventListener('input', (e) => {
      audio.volume = e.target.value / 100;
      volumeSlider.style.setProperty('--vol', e.target.value + '%');
    });

    // ===== KARAOKE =====
    function buildKaraokeHTML() {
      karaokeDisplay.innerHTML = '';
      karaokeSpans = [];

      currentLyrics.forEach((w, i) => {
        const span = document.createElement('span');
        span.className = `kw ${w.type} ${i < currentWordIndex ? 'past' : i === currentWordIndex ? 'current' : 'upcoming'}`;
        span.textContent = w.word;
        span.dataset.index = i;
        karaokeDisplay.appendChild(span);
        karaokeSpans.push(span);
      });

      if (currentLyrics.length === 0) {
        karaokeDisplay.innerHTML = '<span class="kw upcoming">Press ▶ to sing along...</span>';
      }
    }

    function updateKaraoke() {
      const t = audio.currentTime;

      let newIndex = -1;
      for (let i = currentLyrics.length - 1; i >= 0; i--) {
        if (t >= currentLyrics[i].start) {
          newIndex = i;
          break;
        }
      }

      if (newIndex !== currentWordIndex) {
        currentWordIndex = newIndex;
        refreshKaraokeClasses();
        scrollCurrentIntoView();
      }
    }

    function refreshKaraokeClasses() {
      karaokeSpans.forEach((span, i) => {
        span.classList.remove('past', 'current', 'upcoming');
        if (i < currentWordIndex) {
          span.classList.add('past');
        } else if (i === currentWordIndex) {
          span.classList.add('current');
        } else {
          span.classList.add('upcoming');
        }
      });
    }

    function scrollCurrentIntoView() {
      const current = karaokeSpans[currentWordIndex];
      if (current) {
        current.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function formatTime(s) {
      if (!s || isNaN(s)) return '0:00';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${sec.toString().padStart(2, '0')}`;
    }

    // Init
    volumeSlider.style.setProperty('--vol', '70%');
    audio.volume = 0.7;

    function resizeCanvas() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      if (!isPlaying) drawVisualizer();
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Draw idle visualizer initially
    drawIdleBars();

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        if (isPlaying) {
          audio.pause();
          isPlaying = false;
        } else {
          initAudioContext();
          audio.play();
          isPlaying = true;
          buildKaraokeHTML();
          cancelAnimationFrame(idleAnimId);
          drawVisualizer();
        }
      }
    });
  </script>
